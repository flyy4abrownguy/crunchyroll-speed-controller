<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Controller</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <!-- Watching: supported site with a video -->
    <section id="watching" class="state" hidden>
      <header class="show-line">
        <div class="show-info">
          <div id="showName" class="show-name"></div>
          <div class="site-row">
            <span id="siteLabel" class="site-label"></span>
          </div>
        </div>
        <div class="header-end">
          <span class="status"><span class="status-dot"></span>Active</span>
        </div>
      </header>

      <div class="speed-row">
        <button type="button" id="decreaseBtn" class="round-btn" aria-label="Slower" title="Slower">
          <span class="icon" data-icon="minus"></span>
        </button>
        <div id="speedReadout" class="speed-readout" aria-live="polite">
          <span id="speedValue" class="speed-value">1</span><span class="speed-x">x</span>
        </div>
        <button type="button" id="increaseBtn" class="round-btn" aria-label="Faster" title="Faster">
          <span class="icon" data-icon="plus"></span>
        </button>
      </div>

      <div id="presets" class="presets" role="group" aria-label="Speed presets"></div>

      <div id="seriesLine" class="series-line" hidden>
        <span class="series-text">
          <span id="seriesIcon" class="icon icon-sm" data-icon="pin"></span>
          <span id="seriesText"></span>
        </span>
        <button type="button" id="useForAllBtn" class="text-btn">Use for all shows</button>
      </div>

      <div class="divider"></div>

      <label class="toggle-row">
        <span>Auto-skip intros</span>
        <input type="checkbox" class="autoskip-toggle">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <footer class="footer">
        <span class="week-saved">
          <span class="icon icon-sm" data-icon="clock"></span>
          <span id="weekSaved"></span>
        </span>
        <span class="footer-actions">
          <button type="button" id="statsBtn" class="icon-btn" aria-label="Stats" title="Stats">
            <span class="icon" data-icon="chart"></span>
          </button>
          <button type="button" id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <span class="icon" data-icon="settings"></span>
          </button>
        </span>
      </footer>
    </section>

    <!-- Idle: any other tab, or a supported site without a video -->
    <section id="idle" class="state" hidden>
      <header class="idle-header">
        <h1>Speed controller</h1>
        <div class="header-end">
          <button type="button" id="idleSettingsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <span class="icon" data-icon="settings"></span>
          </button>
        </div>
      </header>

      <div id="firstRunCard" class="card stats-card first-run" hidden>
        <div class="first-run-title">Pick a starting speed, then open an episode</div>
        <div class="meta">Your time saved will show up here.</div>
      </div>

      <div id="idleStatsCard" class="card stats-card">
        <div class="card-label">Time saved this week</div>
        <div id="idleWeekSaved" class="big-number">0s</div>
        <div id="idleWeekMeta" class="meta"></div>
      </div>

      <div class="tiles">
        <div class="tile">
          <div class="tile-label">All time</div>
          <div id="allTimeSaved" class="tile-value">0s</div>
        </div>
        <div id="topShowTile" class="tile" hidden>
          <div class="tile-label">Top show</div>
          <div id="topShowName" class="tile-value"></div>
        </div>
      </div>

      <div id="startRow" class="start-row" hidden>
        <div class="start-label">
          <span>Starting speed</span>
          <span class="meta">New shows start here</span>
        </div>
        <div id="startPresets" class="presets" role="group" aria-label="Starting speed"></div>
      </div>

      <label class="toggle-row">
        <span>Auto-skip intros</span>
        <input type="checkbox" class="autoskip-toggle">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <p id="idleHint" class="hint"></p>
      <button type="button" id="notWorkingLink" class="text-btn hint-link" hidden>Speed not working? Tell us</button>
    </section>

    <!-- One-time thank-you prompt (either state) -->
    <aside id="milestoneCard" class="milestone" hidden>
      <span class="icon milestone-icon" data-icon="trophy"></span>
      <div class="milestone-body">
        <div id="milestoneTitle" class="milestone-title"></div>
        <p class="milestone-text">Free forever. If it helped, a tip or a review goes a long way.</p>
        <div class="milestone-actions">
          <button type="button" id="tipBtn" class="btn btn-primary">
            <span class="icon icon-sm" data-icon="heart"></span>Tip
          </button>
          <button type="button" id="rateBtn" class="btn">
            <span class="icon icon-sm" data-icon="star"></span>Rate
          </button>
        </div>
      </div>
      <button type="button" id="dismissMilestone" class="icon-btn icon-btn-sm" aria-label="Dismiss" title="Dismiss">
        <span class="icon icon-sm" data-icon="x"></span>
      </button>
    </aside>
  </main>

  <script src="../shared/logic.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
