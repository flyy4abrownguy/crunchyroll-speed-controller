<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crunchyroll Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Speed Controller</h1>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Checking...</span>
      </div>
    </header>

    <section class="speed-display">
      <span class="speed-value" id="speedValue">1.00</span>
      <span class="speed-label">x</span>
    </section>

    <section class="slider-section">
      <input
        type="range"
        id="speedSlider"
        min="0.25"
        max="4"
        step="0.05"
        value="1"
      >
      <div class="slider-labels">
        <span>0.25x</span>
        <span>4.0x</span>
      </div>
    </section>

    <section class="quick-buttons">
      <button class="quick-btn" data-speed="0.5">0.5x</button>
      <button class="quick-btn" data-speed="0.75">0.75x</button>
      <button class="quick-btn active" data-speed="1">1.0x</button>
      <button class="quick-btn" data-speed="1.25">1.25x</button>
      <button class="quick-btn" data-speed="1.5">1.5x</button>
      <button class="quick-btn" data-speed="2">2.0x</button>
    </section>

    <section class="fine-controls">
      <button class="control-btn" id="decreaseBtn" title="Decrease speed">
        <span id="decreaseLabel">-0.25</span>
      </button>
      <button class="control-btn reset" id="resetBtn" title="Reset to 1.0x">
        Reset
      </button>
      <button class="control-btn" id="increaseBtn" title="Increase speed">
        <span id="increaseLabel">+0.25</span>
      </button>
    </section>

    <section class="settings">
      <label class="setting-item">
        <span>Remember speed</span>
        <input type="checkbox" id="rememberSpeed" checked>
        <span class="toggle"></span>
      </label>
      <label class="setting-item">
        <span>Show indicator</span>
        <input type="checkbox" id="showIndicator" checked>
        <span class="toggle"></span>
      </label>
      <label class="setting-item">
        <span>Per-series speed</span>
        <input type="checkbox" id="perSeriesSpeed">
        <span class="toggle"></span>
      </label>
      <div class="setting-item">
        <span>Speed step</span>
        <select id="speedStepSelect" class="speed-step-select">
          <option value="0.05">0.05x</option>
          <option value="0.1">0.10x</option>
          <option value="0.25" selected>0.25x</option>
        </select>
      </div>
    </section>

    <section class="stats-display">
      <span class="stats-icon">&#9201;</span><span class="stats-value" id="timeSaved">0m</span> saved
    </section>

    <footer>
      <p class="shortcuts-hint">
        Shortcuts: <kbd>Shift</kbd>+<kbd>&gt;</kbd> / <kbd>&lt;</kbd> to adjust
      </p>
      <div class="feedback-trigger" id="feedbackTrigger">Send Feedback</div>
    </footer>

    <section class="feedback-panel" id="feedbackPanel">
      <div class="feedback-types">
        <label class="feedback-type-label">
          <input type="radio" name="fbType" value="bug" checked>
          <span>Bug</span>
        </label>
        <label class="feedback-type-label">
          <input type="radio" name="fbType" value="feature">
          <span>Feature</span>
        </label>
        <label class="feedback-type-label">
          <input type="radio" name="fbType" value="general">
          <span>General</span>
        </label>
      </div>
      <textarea id="feedbackMsg" class="feedback-textarea" placeholder="Your feedback..." maxlength="500" rows="3"></textarea>
      <button class="control-btn reset feedback-submit" id="feedbackSubmit">Submit</button>
      <div class="feedback-status" id="feedbackStatus"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
